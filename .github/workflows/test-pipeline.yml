name: Test Automation Pipeline

on:
  push:
    branches: [ main, develop ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout source code
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------
      # Set up Java 25 LTS
      # ----------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ----------------------------------------
      # Verify Java and Maven
      # ----------------------------------------
      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      # ----------------------------------------
      # Build and compile
      # ----------------------------------------
      - name: Build and compile
        run: mvn clean compile

      # ----------------------------------------
      # Run TestNG tests
      # ----------------------------------------
      - name: Run tests
        env:
          # Credentials from GitHub Secrets
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

          # Test configuration
          BROWSER: chrome
          URL: https://practicesoftwaretesting.com/auth/login
          HEADLESS: true
          EXPLICIT_WAIT: 10
          PAGE_LOAD_TIMEOUT: 30

        run: mvn test

      # ----------------------------------------
      # Upload ExtentReport
      # ----------------------------------------
      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/ExtentReport.html
          retention-days: 30
          if-no-files-found: warn

      # ----------------------------------------
      # Upload screenshots
      # ----------------------------------------
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

      # ----------------------------------------
      # Display generated files
      # ----------------------------------------
      - name: Show test artifacts
        if: always()
        run: |
          echo "========================================"
          echo "Test execution completed"
          echo "========================================"

          echo ""
          echo "Reports:"
          ls -lah reports/ 2>/dev/null || echo "Reports directory not found"

          echo ""
          echo "Screenshots:"
          ls -lah screenshots/ 2>/dev/null || echo "Screenshots directory not found"
